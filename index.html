<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano System - Status & Progression</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PianoSystem">
  
  <!-- Icono para el móvil -->
  <link rel="icon" type="image/svg+xml" href="piano-icon.svg">
  <link rel="apple-touch-icon" href="piano-icon.svg">
  
  <style>
    :root {
      --bg-color: #030712;
      --panel-bg: rgba(4, 13, 26, 0.95);
      --border-color: #00d2ff;
      --text-color: #e0f7fc;
      --accent-color: #00d2ff;
      --exp-color: #ffb703;
      --btn-bg: #00223b;
      --btn-hover: #004b7a;
      --glow-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at center, #081b33 0%, #030712 100%),
        linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* System Window con marco tecnológico de Solo Leveling */
    .system-window {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      box-shadow: var(--glow-shadow), inset 0 0 25px rgba(0, 210, 255, 0.15);
      border-radius: 2px;
      padding: 24px 18px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(8px);
    }

    .system-window::before {
      content: "STATUS WINDOW";
      position: absolute;
      top: -12px;
      left: 15px;
      background: var(--bg-color);
      padding: 0 10px;
      color: var(--accent-color);
      font-size: 11px;
      letter-spacing: 2px;
      border: 1px solid var(--border-color);
    }

    .window-controls {
      position: absolute;
      top: -10px;
      right: 15px;
      background: var(--bg-color);
      padding: 0 8px;
      color: #5f8aad;
      font-size: 10px;
      letter-spacing: 2px;
      border: 1px solid rgba(0, 210, 255, 0.4);
    }

    /* Título principal estilo Solo Leveling enmarcado */
    .system-title-container {
      border: 1px solid rgba(0, 210, 255, 0.5);
      background: rgba(0, 210, 255, 0.05);
      padding: 10px;
      margin: 8px 0 18px 0;
      box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.1);
    }

    .system-title {
      font-size: 15px;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 10px var(--accent-color), 0 0 20px rgba(0, 210, 255, 0.5);
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Stats Grid en 3 columnas */
    .stats-container {
      display: grid;
      grid-template-columns: 1.1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
      text-align: left;
    }

    .stat-card {
      background: rgba(2, 17, 29, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 8px 10px;
      border-radius: 2px;
    }

    .stat-label {
      font-size: 9px;
      color: #7ca5c4;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .stat-value {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
    }

    .stat-value.level {
      color: var(--accent-color);
      text-shadow: 0 0 5px var(--accent-color);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat-value.streak {
      color: #ff6b6b;
      text-shadow: 0 0 5px #ff6b6b;
    }

    .mini-exp-container {
      background: #02111d;
      border: 1px solid rgba(0, 210, 255, 0.5);
      height: 6px;
      border-radius: 1px;
      overflow: hidden;
      margin-top: 2px;
    }

    .mini-exp-bar {
      width: 0%;
      height: 100%;
      background: var(--accent-color);
      box-shadow: 0 0 5px var(--accent-color);
    }

    .mini-exp-text {
      font-size: 8px;
      color: #7ca5c4;
      margin-top: 2px;
      text-align: right;
    }

    /* EXP Section con corchetes */
    .exp-section {
      background: rgba(2, 17, 29, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 10px 12px;
      border-radius: 2px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }

    .exp-label-text {
      color: var(--exp-color);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .exp-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      margin: 0 10px;
    }

    .exp-brackets {
      color: var(--exp-color);
      font-weight: bold;
    }

    .exp-bar-container {
      background: #02111d;
      border: 1px solid var(--exp-color);
      height: 10px;
      flex: 1;
      border-radius: 1px;
      overflow: hidden;
    }

    .exp-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d48806, var(--exp-color));
      box-shadow: 0 0 8px var(--exp-color);
      transition: width 0.3s ease;
    }

    .exp-percentage {
      color: var(--exp-color);
      font-weight: bold;
      min-width: 36px;
      text-align: right;
    }

    /* Daily Quest Box */
    .mission-box {
      background: rgba(2, 17, 29, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.5);
      border-radius: 2px;
      padding: 15px 10px;
      margin-bottom: 15px;
      position: relative;
    }

    .mission-title {
      font-size: 10px;
      color: #7ca5c4;
      letter-spacing: 3px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .timer-display {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 3px;
      margin: 5px 0;
      color: #ffffff;
      text-shadow: 0 0 12px var(--accent-color);
    }

    .target-desc {
      font-size: 10px;
      color: #ffb703;
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 183, 3, 0.4);
    }

    /* Progress Bar */
    .progress-container {
      background: #02111d;
      border: 1px solid var(--border-color);
      height: 8px;
      border-radius: 1px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #005885, #00d2ff);
      box-shadow: 0 0 10px var(--accent-color);
      transition: width 0.3s ease;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
    }

    button {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 4px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      clip-path: polygon(8% 0, 100% 0, 100% 80%, 92% 100%, 0 100%, 0 20%);
    }

    button:hover {
      background: var(--btn-hover);
      box-shadow: var(--glow-shadow);
      color: #fff;
    }

    button:disabled {
      border-color: #1a3a4b;
      background: #081521;
      color: #2c5269;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── SOLO LEVELING NOTIFICATION OVERLAY ── */
    .completed-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 15, 0.96);
      border: 3px solid #ffb703;
      box-shadow: 0 0 40px rgba(255, 183, 3, 0.4), inset 0 0 25px rgba(255, 183, 3, 0.2);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: systemPopup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 20px;
    }

    @keyframes systemPopup {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .system-alert-tag {
      font-size: 9px;
      letter-spacing: 4px;
      color: #ffb703;
      border: 1px dashed #ffb703;
      padding: 2px 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      background: rgba(255, 183, 3, 0.1);
    }

    .pixel-piano-icon {
      font-size: 32px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 8px #ffb703);
      animation: floatIcon 1.5s ease-in-out infinite alternate;
    }

    @keyframes floatIcon {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .completed-title {
      color: #ffb703;
      font-size: 20px;
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(255, 183, 3, 0.8);
      margin-bottom: 10px;
      font-weight: bold;
    }

    .completed-desc {
      color: #ffffff;
      font-size: 12px;
      margin-bottom: 20px;
      line-height: 1.5;
      white-space: pre-line;
      text-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
      border-top: 1px solid rgba(255, 183, 3, 0.3);
      border-bottom: 1px solid rgba(255, 183, 3, 0.3);
      padding: 10px 0;
      width: 100%;
    }

    .close-btn {
      ping: 10px 24px;
      border: 2px solid #ffb703;
      color: #ffb703;
      background: rgba(255, 183, 3, 0.1);
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 11px;
      clip-path: none;
    }

    .close-btn:hover {
      background: #ffb703;
      color: #000;
      box-shadow: 0 0 20px #ffb703;
    }
  </style>
</head>
<body>

  <div class="system-window">
    <div class="window-controls">_ [] X</div>
    
    <!-- Título principal enmarcado sin barras -->
    <div class="system-title-container">
      <div class="system-title">Piano System</div>
    </div>

    <!-- Stats Block -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-label">Nivel Pianista</div>
        <div class="stat-value level" id="levelVal">LVL 37</div>
        <div class="mini-exp-container">
          <div class="mini-exp-bar" id="miniExpBar"></div>
        </div>
        <div class="mini-exp-text" id="miniExpText">37%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Racha Diaria</div>
        <div class="stat-value streak" id="streakVal">🔥 547 DÍAS</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Practicado</div>
        <div class="stat-value" id="totalTimeVal" style="font-size: 11px; margin-top: 2px;">820h 0m</div>
      </div>
    </div>

    <!-- EXP Section -->
    <div class="exp-section">
      <span class="exp-label-text">EXP:</span>
      <div class="exp-bar-wrapper">
        <span class="exp-brackets">[</span>
        <div class="exp-bar-container">
          <div class="exp-bar" id="expBar"></div>
        </div>
        <span class="exp-brackets">]</span>
      </div>
      <span class="exp-percentage" id="expPercentText">85%</span>
    </div>

    <!-- Daily Quest Box -->
    <div class="mission-box">
      <div class="mission-title">Misión Diaria</div>
      <div class="timer-display" id="timer">03:00:00</div>
      <div class="target-desc" id="finishTimeDesc">FIN ESTIMADO: --:--</div>
    </div>

    <!-- Progress Bar General -->
    <div class="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="controls">
      <button id="startBtn">▶ INICIAR</button>
      <button id="pauseBtn" disabled>⏸ PAUSAR</button>
      <button id="resetBtn">🔄 REINICIAR</button>
    </div>

    <!-- Completion / Level Up Modal -->
    <div class="completed-overlay" id="completedOverlay">
      <div class="system-alert-tag">⚠️ NOTIFICACIÓN DEL SISTEMA ⚠️</div>
      <div class="pixel-piano-icon">🎹⚡</div>
      <div class="completed-title" id="overlayTitle">¡LEVEL UP!</div>
      <div class="completed-desc" id="overlayDesc">Has cumplido con la práctica diaria.</div>
      <button class="close-btn" id="closeOverlayBtn">CONFIRMAR</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed', err));
    }

    const DAILY_TARGET_SECONDS = 3 * 3600; 
    const EXP_PER_MINUTE = 1;

    let remainingSeconds = DAILY_TARGET_SECONDS;
    let totalSecondsPracticed = 820 * 3600; 
    let currentExp = 120;
    let currentLevel = 37;
    let streakDays = 547;
    let lastPracticeDate = null;
    let questCompletedToday = false;

    let timerInterval = null;
    let audioCtx = null;
    let expectedEndTime = null;
    let lastTickTime = null;
    let alarmInterval = null;

    const timerDisplay = document.getElementById('timer');
    const finishTimeDesc = document.getElementById('finishTimeDesc');
    const progressBar = document.getElementById('progress');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const completedOverlay = document.getElementById('completedOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');

    const levelVal = document.getElementById('levelVal');
    const streakVal = document.getElementById('streakVal');
    const totalTimeVal = document.getElementById('totalTimeVal');
    const expBar = document.getElementById('expBar');
    const expPercentText = document.getElementById('expPercentText');
    const miniExpBar = document.getElementById('miniExpBar');
    const miniExpText = document.getElementById('miniExpText');

    function getExpRequiredForLevel(level) {
      if (level >= 100) return 99999;
      return Math.round(15 * Math.pow(1.082, level - 1) + 5);
    }

    function getRankName(level) {
      if (level <= 15) return "RANGO E";
      if (level <= 40) return "RANGO D";
      if (level <= 70) return "RANGO C";
      if (level <= 90) return "RANGO B";
      return "RANGO S";
    }

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Efecto de sonido: INICIAR (Sonido ascendente tecnológico tipo "Quest Accepted")
    function playStartSound() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(440, now); // Nota A4
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // Sube a A5 rápido

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    // Efecto de sonido: PAUSAR (Sonido descendente tecnológico de pausa)
    function playPauseSound() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(587.33, now); // Nota D5
        osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.15); // Baja a D4

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    // Efecto de sonido: REINICIAR / CLICK (Doble pulso rápido de sistema)
    function playResetSound() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(600, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    function playAlarmBeep() {
      try {
        initAudioContext();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'square';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1760, now + 0.1);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {
        console.warn("Error reproduciendo beep:", e);
      }
    }

    function startAlarmLoop() {
      stopAlarmLoop();
      playAlarmBeep();
      triggerVibration();

      alarmInterval = setInterval(() => {
        playAlarmBeep();
        triggerVibration();
      }, 800);
    }

    function stopAlarmLoop() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      if ('vibrate' in navigator) {
        navigator.vibrate(0);
      }
    }

    function triggerVibration() {
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
    }

    function loadData() {
      const savedData = localStorage.getItem('piano_system_v7');
      const todayStr = new Date().toISOString().split('T')[0];

      if (savedData) {
        const data = JSON.parse(savedData);
        remainingSeconds = data.remainingSeconds ?? DAILY_TARGET_SECONDS;
        totalSecondsPracticed = data.totalSecondsPracticed ?? totalSecondsPracticed;
        currentExp = data.currentExp ?? currentExp;
        currentLevel = data.currentLevel ?? currentLevel;
        streakDays = data.streakDays ?? streakDays;
        lastPracticeDate = data.lastPracticeDate ?? null;
        questCompletedToday = data.questCompletedTodayDate === todayStr;

        if (data.currentDate !== todayStr) {
          remainingSeconds = DAILY_TARGET_SECONDS;
          questCompletedToday = false;
          
          if (lastPracticeDate) {
            const last = new Date(lastPracticeDate);
            const today = new Date(todayStr);
            const diffDays = Math.floor((today - last) / (1000 * 60 * 60 * 24));
            if (diffDays > 1) {
              streakDays = 0;
            }
          }
        }
      }
      updateUI();
    }

    function saveData() {
      const todayStr = new Date().toISOString().split('T')[0];
      const data = {
        remainingSeconds,
        totalSecondsPracticed,
        currentExp,
        currentLevel,
        streakDays,
        lastPracticeDate,
        questCompletedTodayDate: questCompletedToday ? todayStr : null,
        currentDate: todayStr
      };
      localStorage.setItem('piano_system_v7', JSON.stringify(data));
    }

    function formatTime(totalSecs) {
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      const pad = (num) => String(num).padStart(2, '0');
      return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    }

    function addSecond() {
      totalSecondsPracticed++;
      if (totalSecondsPracticed % 60 === 0) {
        currentExp += EXP_PER_MINUTE;
        let expRequired = getExpRequiredForLevel(currentLevel);
        
        while (currentExp >= expRequired) {
          currentExp -= expRequired;
          currentLevel++;
          expRequired = getExpRequiredForLevel(currentLevel);
          showNotification("¡LEVEL UP!", `¡Has alcanzado el Nivel ${currentLevel}!\n${getRankName(currentLevel)}`, true);
        }
      }
    }

    function updateUI() {
      timerDisplay.textContent = formatTime(remainingSeconds);
      
      const now = new Date();
      const finishDate = new Date(now.getTime() + (remainingSeconds * 1000));
      const timeString = finishDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      finishTimeDesc.textContent = `FIN ESTIMADO: ${timeString}`;

      const elapsedDaily = DAILY_TARGET_SECONDS - remainingSeconds;
      const dailyPercent = Math.min((elapsedDaily / DAILY_TARGET_SECONDS) * 100, 100);
      progressBar.style.width = dailyPercent + '%';

      levelVal.textContent = `LVL ${currentLevel}`;
      streakVal.textContent = `🔥 ${streakDays} DÍAS`;
      
      const totalHrs = Math.floor(totalSecondsPracticed / 3600);
      const totalMins = Math.floor((totalSecondsPracticed % 3600) / 60);
      totalTimeVal.textContent = `${totalHrs}h ${totalMins}m`;

      const expRequired = getExpRequiredForLevel(currentLevel);
      const expPercent = Math.min(Math.round((currentExp / expRequired) * 100), 100);
      
      expBar.style.width = expPercent + '%';
      expPercentText.textContent = `${expPercent}%`;
      
      miniExpBar.style.width = expPercent + '%';
      miniExpText.textContent = `${expPercent}%`;
    }

    function startTimer() {
      initAudioContext();
      if (timerInterval || remainingSeconds <= 0) return;
      
      playStartSound(); // 🔊 Efecto al iniciar

      startBtn.disabled = true;
      pauseBtn.disabled = false;

      lastTickTime = Date.now();
      expectedEndTime = Date.now() + (remainingSeconds * 1000);

      timerInterval = setInterval(() => {
        const now = Date.now();
        const secondsRemainingReal = Math.max(0, Math.round((expectedEndTime - now) / 1000));
        
        const elapsedSecs = Math.round((now - lastTickTime) / 1000);
        if (elapsedSecs > 0) {
          for (let i = 0; i < elapsedSecs; i++) {
            addSecond();
          }
          lastTickTime = now;
        }

        remainingSeconds = secondsRemainingReal;
        updateUI();
        saveData();

        if (remainingSeconds <= 0) {
          pauseTimer();

          if (!questCompletedToday) {
            questCompletedToday = true;
            const todayStr = new Date().toISOString().split('T')[0];
            if (lastPracticeDate !== todayStr) {
              streakDays++;
              lastPracticeDate = todayStr;
            }
            updateUI();
            saveData();
            showNotification("¡MISIÓN CUMPLIDA!", "Has completado tu entrenamiento diario.\n+Racha de días incrementada.", true);
          } else {
            showNotification("¡TIEMPO FINALIZADO!", "Sesión de práctica concluida.", true);
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerInterval) {
        playPauseSound(); // 🔊 Efecto al pausar
      }
      clearInterval(timerInterval);
      timerInterval = null;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      updateUI();
    }

    function resetTimer() {
      playResetSound(); // 🔊 Efecto al pulsar reiniciar
      if (confirm('¿Quieres reiniciar el temporizador de la misión de hoy?')) {
        pauseTimer();
        remainingSeconds = DAILY_TARGET_SECONDS;
        updateUI();
        saveData();
      }
    }

    function showNotification(title, msg, isAlarm) {
      overlayTitle.innerText = title;
      overlayDesc.innerText = msg;
      completedOverlay.style.display = 'flex';
      
      if (isAlarm) {
        startAlarmLoop();
      }
    }

    startBtn.addEventListener('click', () => {
      initAudioContext();
      startTimer();
    });
    
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);
    
    closeOverlayBtn.addEventListener('click', () => {
      stopAlarmLoop();
      completedOverlay.style.display = 'none';
    });

    loadData();
  </script>
</body>
</html>
